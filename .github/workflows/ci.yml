name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -v -count=1

      - name: Vet
        run: go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            label: linux-amd64
          - goos: linux
            goarch: arm64
            label: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "5"
            label: linux-armv5
          - goos: linux
            goarch: arm
            goarm: "6"
            label: linux-armv6
          - goos: linux
            goarch: arm
            goarm: "7"
            label: linux-armv7
          - goos: linux
            goarch: mips
            gomips: softfloat
            label: linux-mips
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            label: linux-mipsle
          - goos: windows
            goarch: amd64
            label: windows-amd64
          - goos: darwin
            goarch: amd64
            label: darwin-amd64
          - goos: darwin
            goarch: arm64
            label: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: |
          ext=""
          ldflags="-s -w"
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          if [ "$GOOS" = "windows" ]; then ldflags="-H=windowsgui -s -w"; fi
          go build -trimpath -ldflags="$ldflags" -o "dist/esurfing-${{ matrix.label }}${ext}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: esurfing-${{ matrix.label }}
          path: dist/

  package-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: esurfing-windows-amd64
          path: package/esurfing-windows-amd64

      - name: Package Windows Portable release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          root="package/EsurfingGo-${version}-windows-amd64"
          mkdir -p "$root/docs"
          cp package/esurfing-windows-amd64/esurfing-windows-amd64.exe "$root/"
          cp README.md LICENSE esurfing.example.json "$root/"
          cp docs/windows-local.md "$root/docs/"
          mkdir -p dist
          (cd package && zip -qr "../dist/EsurfingGo-${version}-windows-amd64.zip" "EsurfingGo-${version}-windows-amd64")
          (cd dist && sha256sum "EsurfingGo-${version}-windows-amd64.zip" > SHA256SUMS.txt)

      - name: Upload Windows Portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: esurfing-windows-amd64-portable
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, package-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/esurfing-*
            artifacts/EsurfingGo-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
